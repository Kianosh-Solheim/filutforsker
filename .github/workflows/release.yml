name: Utgivelse

# Starter på to måter:
#  1. Actions › Utgivelse › «Run workflow» (versjonen hentes fra app/package.json)
#  2. Push en versjons-tag:  git tag v1.1.1 && git push origin v1.1.1
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Finn versjon
        run: |
          APPV="$(node -p "require('./app/package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$APPV" ]; then
              echo "::error::Taggen ($GITHUB_REF_NAME) må være lik versjonen i app/package.json ($APPV)."
              exit 1
            fi
          fi
          echo "TAG=v$APPV" >> "$GITHUB_ENV"
          echo "VERSION=$APPV" >> "$GITHUB_ENV"

      - name: Sjekk JavaScript-syntaks
        run: |
          for f in app/*.js app/renderer/*.js bootstrap/*.js; do node --check "$f"; done

      - name: Installer byggeverktøy
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xorriso zip unzip
          curl -fsSL -o rc.tgz "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz"
          echo "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002  rc.tgz" | sha256sum -c -
          tar xzf rc.tgz
          sudo install -m 755 apple-codesign-0.29.0-x86_64-unknown-linux-musl/rcodesign /usr/local/bin/rcodesign

      - name: Bygg DMG og oppdateringspakke
        run: bash build/make-dmg.sh

      - name: Publiser utgivelsen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="out/Filutforsker.dmg out/filutforsker-app.zip out/filutforsker-app.zip.sha256"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
            gh release edit "$TAG" --title "Filutforsker $VERSION" --notes-file out/notes.md --latest
          else
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" --title "Filutforsker $VERSION" --notes-file out/notes.md --latest
          fi
